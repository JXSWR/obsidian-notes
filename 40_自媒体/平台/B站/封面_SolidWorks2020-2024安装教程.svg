<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Arial Black','Helvetica Neue',Arial,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d1f"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0" stop-color="#ff6a00" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#ff6a00" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- 左侧橙色竖条 -->
  <rect x="84" y="120" width="14" height="480" rx="6" fill="#ff6a00"/>

  <!-- 右侧 SW 红立方体（矢量绘制） -->
  <g transform="translate(980,360)">
    <!-- 三个面（深红） -->
    <polygon points="0,-160 150,-80 0,0 -150,-80" fill="#cf1f12"/>
    <polygon points="150,-80 150,80 0,160 0,0" fill="#b01810"/>
    <polygon points="-150,-80 0,0 0,160 -150,80" fill="#8f130c"/>
    <!-- 棱边（与面同色，不显白边） -->
    <g fill="none" stroke="#8f130c" stroke-opacity="0.6" stroke-width="2">
      <path d="M0,-160 L150,-80 L150,80 L0,160 L-150,80 L-150,-80 Z"/>
      <path d="M-150,-80 L0,0 L150,-80"/>
      <path d="M0,0 L0,160"/>
    </g>
    <!-- 左面 S（立体挤出：下向侧壁 + 白顶面） -->
    <text transform="translate(-75,63) skewY(28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#7a0f08" text-anchor="middle" dominant-baseline="central">S</text>
    <text transform="translate(-75,60) skewY(28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#7a0f08" text-anchor="middle" dominant-baseline="central">S</text>
    <text transform="translate(-75,57) skewY(28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#7a0f08" text-anchor="middle" dominant-baseline="central">S</text>
    <text transform="translate(-75,54) skewY(28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#7a0f08" text-anchor="middle" dominant-baseline="central">S</text>
    <text transform="translate(-75,51) skewY(28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#7a0f08" text-anchor="middle" dominant-baseline="central">S</text>
    <text transform="translate(-75,48) skewY(28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#7a0f08" text-anchor="middle" dominant-baseline="central">S</text>
    <text transform="translate(-75,45) skewY(28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#ffffff" text-anchor="middle" dominant-baseline="central">S</text>
    <!-- 右面 W（立体挤出：下向侧壁 + 白顶面） -->
    <text transform="translate(75,63) skewY(-28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#7a0f08" text-anchor="middle" dominant-baseline="central">W</text>
    <text transform="translate(75,60) skewY(-28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#7a0f08" text-anchor="middle" dominant-baseline="central">W</text>
    <text transform="translate(75,57) skewY(-28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#7a0f08" text-anchor="middle" dominant-baseline="central">W</text>
    <text transform="translate(75,54) skewY(-28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#7a0f08" text-anchor="middle" dominant-baseline="central">W</text>
    <text transform="translate(75,51) skewY(-28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#7a0f08" text-anchor="middle" dominant-baseline="central">W</text>
    <text transform="translate(75,48) skewY(-28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#7a0f08" text-anchor="middle" dominant-baseline="central">W</text>
    <text transform="translate(75,45) skewY(-28)" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="112" fill="#ffffff" text-anchor="middle" dominant-baseline="central">W</text>
  </g>

  <!-- 标题 -->
  <text x="130" y="300" font-size="104" font-weight="900" fill="#ffffff" letter-spacing="2">SOLIDWORKS</text>
  <text x="132" y="418" font-size="86" font-weight="900" fill="#ff6a00" letter-spacing="1">2020&#8211;2024</text>
  <text x="134" y="512" font-size="84" font-weight="900" fill="#ffffff" letter-spacing="6">安装教程</text>

  <!-- 副标题 -->
  <text x="136" y="566" font-size="30" font-weight="700" fill="#b8b8b8" letter-spacing="2">版本怎么选 &#183; 全流程一次装对</text>

  <!-- 底部小标 -->
  <rect x="136" y="600" width="190" height="40" rx="20" fill="#ff6a00" fill-opacity="0.15"/>
  <text x="160" y="627" font-size="24" font-weight="700" fill="#ff8c1a" letter-spacing="1">B&#31449; &#183; 技术教程</text>
</svg>
